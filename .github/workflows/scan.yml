# The scan job. Runs the pipeline server-side and commits the ledger to main.
# Visitors never trigger scoring; this job is the only thing that spends
# tokens. Hourly on a schedule; also callable (live-check.yml) and manually
# dispatchable. The run report lands in the Actions job summary.
name: scan

# GitHub runs a schedule as the author of the last commit that touched this
# file on the default branch. That author must be an account with write access
# to the repository; a commit under an unlinked or foreign identity leaves the
# schedule registered but never fired (DEFECTS.md v2-30). Re-commit the cron
# line from the operator's account after any change to this file. The minute
# must match SCAN_MINUTE_UTC in pipeline/config.js (the site's NEXT RUN chip
# reads it). The expression itself was changed once to force GitHub to
# re-register the schedule (DEFECTS.md v2-37).
on:
  schedule:
    - cron: '11 * * * *' # hourly at :11 UTC; off the top of the hour to dodge runner congestion
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch feeds only; score nothing'
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set; nothing scored, nothing written."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scan
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional second fetch route from the Vercel deployment
          # (api/fetch-article.js): the function URL as a repository variable,
          # the shared token as a secret and as SIGNAL_FETCH_TOKEN in Vercel.
          SIGNAL_FETCH_URL: ${{ vars.SIGNAL_FETCH_URL }}
          SIGNAL_FETCH_TOKEN: ${{ secrets.SIGNAL_FETCH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/scan.js --dry-run --report run-report.md
          else
            node scripts/scan.js --report run-report.md
          fi
          cat run-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run report
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.md
          retention-days: 30

      - name: Commit ledger
        if: steps.key.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push failed, retry $i"
            sleep $((10 * i))
          done
          exit 1
